name: Deploy Portfolio to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexing:
        description: Publish search-indexing files
        required: true
        default: validation
        type: choice
        options:
          - validation
          - production

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_INDEXING: ${{ inputs.indexing || 'validation' }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
